plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // PAL bundles its helper libs (mocha, javassist) inside its jar (jar-in-jar).
}

loom {
    splitEnvironmentSourceSets()

    mods {
        avalon {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // AzureLib 3.2.4 (Bedrock/Blockbench models + animations) and Player Animation Library 1.1.6.
    // Shipped as local jars (libs/) so the build never depends on a guessed maven coordinate.
    modImplementation files('libs/azurelib-fabric-1_21_1-3_2_4.jar')
    modImplementation files('libs/PlayerAnimationLibFabric-1_1_6_mc_1_21_1.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
